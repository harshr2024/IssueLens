services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: issuelens
      POSTGRES_USER: issuelens
      POSTGRES_PASSWORD: issuelens
    ports:
      - "5433:5432"
    volumes:
      - issuelens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuelens -d issuelens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  issuelens_postgres_data:
